[package]
name = "isee"
version = "0.2.2"
edition = "2024"
license = "MIT"
authors = ["Seamile <lanhuermao@gmail.com>"]
description = "A small tool for previewing images in the terminal."
homepage = "https://github.com/seamile/isee"
repository = "https://github.com/seamile/isee"
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "isee"
path = "src/main.rs"

[dependencies]
image  = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp",
    "bmp", "pnm", "qoi", "ff", "ico",
    "tiff", "hdr", "exr",
] }
# Animated-WebP frames: `image` exposes only the static WebP decoder, so the
# animation decode goes through image-webp's own API directly (already in the
# lockfile as image's transitive dependency).
image-webp = "0.2"
jpeg-decoder = { version = "0.3.2", default-features = false }
libc   = "0.2"
flate2 = "1.1.10"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images", "svgz"] }
palette   = { version = "0.7.7", default-features = false }
quantette = { version = "0.6.0", default-features = false }

# HEIC decoding rides the system ImageIO/CoreGraphics frameworks on macOS
# (no libheif, nothing dynamic to ship). Feature sets are kept minimal.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFArray",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry",
    "CGImage", "CGDataProvider",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = [
    "std", "objc2", "objc2-core-graphics", "CGImageSource", "CGImageProperties",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
codegen-units = 256
